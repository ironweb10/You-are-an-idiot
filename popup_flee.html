<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are an idiot!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      cursor: none;
    }
    video {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .customCursor {
      position: fixed;
      width: 30px;
      height: 30px;
      background: #ff0;
      border: 3px solid #000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      box-shadow: 0 0 15px #ff0;
      animation: cursorPulse 0.5s infinite alternate;
    }
    @keyframes cursorPulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <video autoplay loop muted>
    <source src="tu_video.mp4" type="video/mp4">
  </video>
  <div class="customCursor" id="cursor"></div>

  <script>
    let mouseX = 0, mouseY = 0;
    let targetX = window.screenX;
    let targetY = window.screenY;
    const fleeDistance = 200;
    const fleeSpeed = 25;

    const cursor = document.getElementById('cursor');
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = (mouseX - 15) + 'px';
      cursor.style.top = (mouseY - 15) + 'px';
    });

    function updatePosition() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const dx = centerX - mouseX;
      const dy = centerY - mouseY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < fleeDistance && distance > 0) {
        const angle = Math.atan2(dy, dx);
        targetX += Math.cos(angle) * fleeSpeed;
        targetY += Math.sin(angle) * fleeSpeed;
      } else {
        targetX += (Math.random() - 0.5) * 8;
        targetY += (Math.random() - 0.5) * 8;
      }

      targetX = Math.max(0, Math.min(screen.availWidth - window.outerWidth, targetX));
      targetY = Math.max(0, Math.min(screen.availHeight - window.outerHeight, targetY));

      window.moveTo(targetX, targetY);
      requestAnimationFrame(updatePosition);
    }

    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
      return '';
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    updatePosition();
  </script>
</body>
</html>
